<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>__TITLE__</title>
<style>
:root{--bg:#f0f2f5;--card:#fff;--ink:#2a4451;--mute:#566b75;--line:#d6dbe3;--accent:#2a7f63;
--ok:#12805c;--okbg:#dcf5ea;--prog:#1f5fbf;--progbg:#dfeafc;--bad:#b42318;--badbg:#fde4e1;--warn:#946200;--warnbg:#fdf1d3;--neu:#475467;--neubg:#eceff3}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16242b;--card:#1d2f38;--ink:#e7edf0;--mute:#9db0b9;--line:#2f4652;--accent:#31b791;
--ok:#5fd6a4;--okbg:#12382b;--prog:#8db4ff;--progbg:#16294a;--bad:#ff9d93;--badbg:#44211d;--warn:#f3c969;--warnbg:#3d3010;--neu:#b4bccb;--neubg:#252a35}}
:root[data-theme=dark]{--bg:#16242b;--card:#1d2f38;--ink:#e7edf0;--mute:#9db0b9;--line:#2f4652;--accent:#31b791;
--ok:#5fd6a4;--okbg:#12382b;--prog:#8db4ff;--progbg:#16294a;--bad:#ff9d93;--badbg:#44211d;--warn:#f3c969;--warnbg:#3d3010;--neu:#b4bccb;--neubg:#252a35}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.in{width:100%;max-width:1180px;margin:0 auto;padding-left:16px;padding-right:16px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(8px)){.top{background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px)}}
.top .in{padding-top:14px;padding-bottom:10px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.head>div:first-child{min-width:0}
h1{margin:0;font-size:24px;letter-spacing:-.01em;line-height:1.2}
.sub{color:var(--mute);margin-top:2px;font-size:13px}
.main{flex:1 0 auto;padding-top:20px;padding-bottom:32px}
.foot{flex:none;border-top:1px solid var(--line);color:var(--mute);font-size:12.5px}
.foot .in{padding-top:14px;padding-bottom:14px}
.btn{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
nav{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;white-space:nowrap;background:transparent;color:var(--mute);border:1px solid transparent;border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
nav button[aria-selected=true]{background:var(--card);color:var(--ink);border-color:var(--line);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.tile .l{color:var(--mute);font-size:13px}
.tile .v{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:4px 0}
.tile .n{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input[type=search]{flex:1;min-width:180px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.count{color:var(--mute);font-size:13px}
.dist{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--neubg);margin:6px 0 8px}
.dist span{display:block;height:100%}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.legend button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer}
.legend button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.scroll{overflow:auto;max-height:max(260px,calc(100vh - 400px));border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--card);cursor:pointer;white-space:nowrap;font-size:13px;color:var(--mute);user-select:none;z-index:1}
th[aria-sort=ascending]::after{content:" \25B2"}th[aria-sort=descending]::after{content:" \25BC"}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--okbg);color:var(--ok)}.c-prog{background:var(--progbg);color:var(--prog)}
.c-bad{background:var(--badbg);color:var(--bad)}.c-warn{background:var(--warnbg);color:var(--warn)}.c-neu{background:var(--neubg);color:var(--neu)}
.bar{display:flex;align-items:center;gap:8px;min-width:110px}.bar i{display:block;height:8px;border-radius:4px;background:var(--accent)}
.bar b{flex:0 0 100px;height:8px;border-radius:4px;background:var(--neubg);overflow:hidden;display:block}.bar em{font-style:normal;font-size:13px;color:var(--mute)}
a{color:var(--accent)}
.lock{width:calc(100% - 32px);max-width:380px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
.lock input{width:100%;margin:12px 0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
.err{color:var(--bad);min-height:1.3em;font-size:14px}
/* brand + chart */
.brandrow{display:flex;align-items:center;gap:14px;min-width:0}
.brandrow a{display:block;flex:none;line-height:0}
.logo{display:block;height:36px;max-width:190px;width:auto;object-fit:contain}
.chartwrap{position:relative}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.chartwrap .gl{stroke:var(--line);stroke-width:1}
.chartwrap text{fill:var(--mute);font-size:11px;font-family:inherit}
.chartwrap .ln{fill:none;stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
.chartwrap .hov{stroke:var(--mute);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:5;white-space:nowrap}
.tip b{display:block;margin-bottom:3px}.tip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.sums{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14px}.sums b{font-size:17px}.sums span{color:var(--mute)}
.axisnote{color:var(--mute);font-size:12px;margin:2px 0 10px}
@media (max-width:600px){.logo{height:28px;max-width:130px}h1{font-size:20px}.tile .v{font-size:26px}.top .in{padding-top:10px;padding-bottom:8px}.sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
</style>
</head>
<body>
<div id="app"></div>
<script>/*__PAYLOAD__*/</script>
<script>
(function(){
var app=document.getElementById('app');
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}

function makeFooter(brand){
  var f=el('footer','foot'),i=el('div','in');
  if(brand&&brand.footer){i.appendChild(el('div',null,brand.footer));i.lastChild.style.marginBottom='4px'}
  i.appendChild(document.createTextNode('Built with '));
  var a=el('a',null,'SheetPress');a.href='__SITE_URL__';a.target='_blank';a.rel='noopener';i.appendChild(a);
  f.appendChild(i);return f;
}

function unlockUI(){
  var box=el('div','lock');
  box.appendChild(el('h2',null,document.title));
  box.appendChild(el('div','sub','This report is private. Enter the password to view it.'));
  var inp=el('input');inp.type='password';inp.placeholder='Password';inp.autocomplete='current-password';
  var err=el('div','err');var go=el('button','btn','Unlock');
  box.append(inp,go,err);app.appendChild(box);app.appendChild(makeFooter());inp.focus();
  async function attempt(){
    err.textContent='';
    try{
      var E=window.__ENC__,enc=new TextEncoder();
      var base=await crypto.subtle.importKey('raw',enc.encode(inp.value),'PBKDF2',false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.salt),iterations:E.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.iv)},key,b64(E.ct));
      app.textContent='';render(JSON.parse(new TextDecoder().decode(pt)));
    }catch(e){err.textContent='Wrong password.'}
  }
  go.onclick=attempt;inp.onkeydown=function(e){if(e.key==='Enter')attempt()};
}

function statusClass(v){
  var s=String(v).toLowerCase();
  if(/^(done|complete|completed|live|yes|pass|passed|ok|fixed|resolved|published|green|shipped|bought|purchased|got it)\b/.test(s))return'c-ok';
  if(/(progress|doing|wip|review|started|ongoing|testing|scheduled|yellow)/.test(s)&&!/not started/.test(s))return'c-prog';
  if(/^(blocked|fail|failed|late|overdue|no|red|stuck|missing|error|at risk)\b/.test(s))return'c-bad';
  if(/(open|pending|waiting|hold|todo|to do|not started|planned|partial|amber|queued|needed|to buy)/.test(s))return'c-warn';
  return'c-neu';
}
var STATUS_COLOR={'c-ok':'var(--ok)','c-prog':'var(--prog)','c-bad':'var(--bad)','c-warn':'var(--warn)','c-neu':'var(--mute)'};

function analyse(sheet){
  return sheet.headers.map(function(h,ci){
    var vals=sheet.rows.map(function(r){return r[ci]}).filter(function(v){return v!==''});
    var nums=vals.filter(function(v){return typeof v==='number'});
    var numeric=vals.length>0&&nums.length/vals.length>=.8;
    var uniq=Array.from(new Set(vals.map(String)));
    var type='text';
    if(numeric){
      var pct=/(%|percent|pct|progress|complete)/i.test(h)&&!/(rate|ctr|share|growth|change|position|pos\b)/i.test(h)&&nums.every(function(n){return n>=0&&n<=100||n>=0&&n<=1});
      type=pct?'pct':'num';
      if(pct)type=nums.every(function(n){return n<=1})?'pct1':'pct100';
    }else if(uniq.length<=8&&vals.length>=3&&(/(status|state|stage|health|priority|result)/i.test(h)||uniq.length<=5&&vals.length>=12)){
      type='status';
    }
    return{type:type,uniq:uniq};
  });
}

function fmtNum(n){return typeof n==='number'?n.toLocaleString(undefined,{maximumFractionDigits:2}):n}

function renderCell(td,v,col){
  if(v===''){td.textContent='';return}
  if(col.type==='status'){td.appendChild(el('span','chip '+statusClass(v),String(v)));return}
  if(col.type==='pct1'||col.type==='pct100'){
    var p=col.type==='pct1'?v*100:v;p=Math.max(0,Math.min(100,p));
    var w=el('div','bar'),b=el('b'),i=el('i');i.style.width=p+'%';b.appendChild(i);
    w.append(b,el('em',null,Math.round(p)+'%'));td.appendChild(w);return;
  }
  if(col.type==='num'){td.className='num';td.textContent=fmtNum(v);return}
  var s=String(v);
  if(/^https?:\/\/\S+$/.test(s)){var a=el('a',null,s.replace(/^https?:\/\/(www\.)?/,''));a.href=s;a.target='_blank';a.rel='noopener noreferrer';td.appendChild(a)}
  else td.textContent=s;
}

function summaryView(sheet){
  var wrap=el('div','tiles');
  sheet.rows.forEach(function(r){
    var t=el('div','tile');
    t.appendChild(el('div','l',String(r[0])));
    t.appendChild(el('div','v',fmtNum(r[1])));
    var note=r.slice(2).filter(function(x){return x!==''}).join(' · ');
    if(note)t.appendChild(el('div','n',note));
    wrap.appendChild(t);
  });
  return wrap;
}

function tableView(sheet){
  var cols=analyse(sheet),state={q:'',sort:-1,dir:1,filter:null,fcol:-1};
  var root=el('div','card');
  var sc=cols.findIndex(function(c){return c.type==='status'});
  var legend=null;
  if(sc>=0){
    var counts={};sheet.rows.forEach(function(r){var k=String(r[sc]||'(blank)');counts[k]=(counts[k]||0)+1});
    var keys=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]});
    var dist=el('div','dist');
    keys.forEach(function(k){var s=el('span');s.style.width=(counts[k]/sheet.rows.length*100)+'%';s.style.background=STATUS_COLOR[statusClass(k)];s.title=k+': '+counts[k];dist.appendChild(s)});
    root.appendChild(dist);
    legend=el('div','legend');
    keys.forEach(function(k){
      var b=el('button',null,k+'  '+counts[k]);b.setAttribute('aria-pressed','false');
      b.onclick=function(){state.filter=state.filter===k?null:k;Array.from(legend.children).forEach(function(x){x.setAttribute('aria-pressed','false')});if(state.filter)b.setAttribute('aria-pressed','true');draw()};
      legend.appendChild(b);
    });
    root.appendChild(legend);
  }
  var qi=sheet.headers.findIndex(function(h){return /^(qty|quantity)$/i.test(h)}),pi=sheet.headers.findIndex(function(h){return /^(price|cost)$/i.test(h)});
  var listy=pi>=0||(sc>=0&&sheet.rows.some(function(r){return /^(needed|bought|purchased|to buy|got it|have)$/i.test(String(r[sc]).trim())}));
  if(listy){
    var sums=el('div','sums'),cu=(window.__CUR__||'$'),tot=0,got=0,done=/^(bought|done|got it|have|complete|completed|purchased)$/i;
    sheet.rows.forEach(function(r){
      var pr=pi>=0?parseFloat(r[pi]):NaN,qn=qi>=0?(parseFloat(r[qi])||1):1;
      if(!isNaN(pr))tot+=pr*qn;
      if(sc>=0&&done.test(String(r[sc]).trim()))got++;
    });
    function part(v,l){var d=el('div');d.appendChild(el('b',null,v));d.appendChild(document.createTextNode(' '));d.appendChild(el('span',null,l));sums.appendChild(d)}
    part(String(sheet.rows.length),'items');
    if(sc>=0)part(String(got),'done');
    if(pi>=0)part(cu+tot.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),'estimated total');
    root.appendChild(sums);
  }
  var tools=el('div','tools'),q=el('input');q.type='search';q.placeholder='Search '+sheet.name+'...';q.setAttribute('aria-label','Search');
  var count=el('span','count');tools.append(q,count);root.appendChild(tools);
  var sw=el('div','scroll'),table=el('table'),thead=el('thead'),tbody=el('tbody'),hr=el('tr');
  sheet.headers.forEach(function(h,ci){
    var th=el('th',null,h);th.tabIndex=0;if(cols[ci].type==='num')th.style.textAlign='right';
    function go(){state.dir=state.sort===ci?-state.dir:1;state.sort=ci;draw()}
    th.onclick=go;th.onkeydown=function(e){if(e.key==='Enter')go()};hr.appendChild(th);
  });
  thead.appendChild(hr);table.append(thead,tbody);sw.appendChild(table);root.appendChild(sw);
  q.oninput=function(){state.q=q.value.toLowerCase();draw()};
  function draw(){
    var rows=sheet.rows.filter(function(r){
      if(state.filter!==null&&String(r[sc]||'(blank)')!==state.filter)return false;
      return !state.q||r.some(function(c){return String(c).toLowerCase().indexOf(state.q)>=0});
    });
    if(state.sort>=0){
      var c=state.sort,d=state.dir;
      rows=rows.slice().sort(function(a,b){
        var x=a[c],y=b[c];if(x===''&&y!=='')return 1;if(y===''&&x!=='')return -1;
        if(typeof x==='number'&&typeof y==='number')return(x-y)*d;
        return String(x).localeCompare(String(y),undefined,{numeric:true})*d;
      });
    }
    Array.from(hr.children).forEach(function(th,i){if(i===state.sort)th.setAttribute('aria-sort',state.dir>0?'ascending':'descending');else th.removeAttribute('aria-sort')});
    tbody.textContent='';
    var frag=document.createDocumentFragment();
    rows.forEach(function(r){var tr=el('tr');r.forEach(function(v,ci){var td=el('td');renderCell(td,v,cols[ci]);tr.appendChild(td)});frag.appendChild(tr)});
    tbody.appendChild(frag);
    count.textContent=rows.length+' of '+sheet.rows.length+' rows';
  }
  draw();return root;
}

var PALETTE=['var(--accent)','#3b82f6','#f97316','#22c55e','#a855f7','#ef4444'];
function niceMax(v){if(v<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function fmtAxis(n){return Math.abs(n)>=1000?(Math.round(n/100)/10)+'k':String(Math.round(n*10)/10)}
function xLabel(v){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(v));if(!m)return String(v);return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2]-1]+' '+(+m[3])}
function SVG(t,a){var e=document.createElementNS('http://www.w3.org/2000/svg',t);for(var k in a)e.setAttribute(k,a[k]);return e}

function chartView(sheet){
  var wrap=el('div');
  var cols=analyse(sheet);
  var sidx=[];cols.forEach(function(c,i){if(i>0&&(c.type==='num'||c.type==='pct100'||c.type==='pct1'))sidx.push(i)});
  var card=el('div','card');
  if(sheet.rows.length<2||!sidx.length){card.appendChild(el('div','sub','A chart needs the first column as labels (dates work best), at least one number column and two or more rows.'));wrap.appendChild(card);wrap.appendChild(tableView(sheet));return wrap}
  var rows=sheet.rows,n=rows.length;
  var maxes=sidx.map(function(ci){return Math.max.apply(null,rows.map(function(r){return typeof r[ci]==='number'?r[ci]:0}))});
  var big=Math.max.apply(null,maxes);
  // Series within 8x of the biggest share the left axis; much smaller ones (clicks next to impressions) get their own right axis.
  var side=sidx.map(function(ci,k){return maxes[k]*8>=big?'L':'R'});
  var hasR=side.indexOf('R')>=0;
  var on=sidx.map(function(){return true});
  var lg=el('div','legend');
  sidx.forEach(function(ci,k){
    var b=el('button');b.setAttribute('aria-pressed','true');
    var sw=el('span','swatch');sw.style.background=PALETTE[k%PALETTE.length];
    b.append(sw,document.createTextNode(sheet.headers[ci]+(hasR?(side[k]==='R'?' (right axis)':' (left axis)'):'')));
    b.onclick=function(){on[k]=!on[k];b.setAttribute('aria-pressed',on[k]?'true':'false');b.style.opacity=on[k]?1:.45;draw()};
    lg.appendChild(b);
  });
  card.appendChild(lg);
  var cw=el('div','chartwrap');card.appendChild(cw);wrap.appendChild(card);
  var tip=el('div','tip');tip.style.display='none';cw.appendChild(tip);
  function draw(){
    var W=Math.max(300,cw.clientWidth||700),H=W<520?260:340;
    var padL=44,padR=hasR?44:14,padT=12,padB=28,iw=W-padL-padR,ih=H-padT-padB;
    var svg=SVG('svg',{viewBox:'0 0 '+W+' '+H,width:W,height:H,role:'img','aria-label':sheet.name+' line chart'});
    var mx={L:0,R:0};
    sidx.forEach(function(ci,k){if(on[k])mx[side[k]]=Math.max(mx[side[k]],maxes[k])});
    mx.L=niceMax(mx.L||1);mx.R=niceMax(mx.R||1);
    function X(i){return padL+(n===1?0:i*iw/(n-1))}
    function Y(v,sd){return padT+ih-(v/mx[sd])*ih}
    for(var g=0;g<=4;g++){
      var gy=padT+ih*g/4;svg.appendChild(SVG('line',{x1:padL,x2:padL+iw,y1:gy,y2:gy,'class':'gl'}));
      var tl=SVG('text',{x:padL-6,y:gy+4,'text-anchor':'end'});tl.textContent=fmtAxis(mx.L*(4-g)/4);svg.appendChild(tl);
      if(hasR){var tr=SVG('text',{x:padL+iw+6,y:gy+4,'text-anchor':'start'});tr.textContent=fmtAxis(mx.R*(4-g)/4);svg.appendChild(tr)}
    }
    var ticks=Math.min(n,W<520?4:7);
    for(var t=0;t<ticks;t++){
      var i=ticks===1?0:Math.round(t*(n-1)/(ticks-1));
      var xt=SVG('text',{x:X(i),y:H-8,'text-anchor':t===0?'start':t===ticks-1?'end':'middle'});xt.textContent=xLabel(rows[i][0]);svg.appendChild(xt);
    }
    sidx.forEach(function(ci,k){
      if(!on[k])return;
      var d='';rows.forEach(function(r,i){var v=typeof r[ci]==='number'?r[ci]:null;if(v===null)return;d+=(d?'L':'M')+X(i).toFixed(1)+' '+Y(v,side[k]).toFixed(1)});
      var p=SVG('path',{d:d,'class':'ln',stroke:PALETTE[k%PALETTE.length]});svg.appendChild(p);
      if(n<=45)rows.forEach(function(r,i){if(typeof r[ci]==='number')svg.appendChild(SVG('circle',{cx:X(i),cy:Y(r[ci],side[k]),r:2.6,fill:PALETTE[k%PALETTE.length]}))});
    });
    var hv=SVG('line',{y1:padT,y2:padT+ih,'class':'hov',visibility:'hidden'});svg.appendChild(hv);
    var hit=SVG('rect',{x:padL,y:padT,width:iw,height:ih,fill:'transparent'});svg.appendChild(hit);
    function move(ev){
      var rc=svg.getBoundingClientRect(),px=(ev.clientX-rc.left)*(W/rc.width);
      var i=Math.max(0,Math.min(n-1,Math.round((px-padL)/iw*(n-1))));
      hv.setAttribute('x1',X(i));hv.setAttribute('x2',X(i));hv.setAttribute('visibility','visible');
      tip.textContent='';var b=el('b',null,xLabel(rows[i][0]));tip.appendChild(b);
      sidx.forEach(function(ci,k){if(!on[k])return;var line=el('div');var dot=el('i');dot.style.background=PALETTE[k%PALETTE.length];line.append(dot,document.createTextNode(sheet.headers[ci]+': '+fmtNum(rows[i][ci])));tip.appendChild(line)});
      tip.style.display='block';
      var tx=X(i)+14;if(tx+tip.offsetWidth>W)tx=X(i)-tip.offsetWidth-14;tip.style.left=Math.max(0,tx)+'px';tip.style.top=(padT+8)+'px';
    }
    hit.addEventListener('mousemove',move);hit.addEventListener('touchmove',function(e){move(e.touches[0])},{passive:true});
    hit.addEventListener('mouseleave',function(){tip.style.display='none';hv.setAttribute('visibility','hidden')});
    var old=cw.querySelector('svg');if(old)cw.replaceChild(svg,old);else cw.insertBefore(svg,tip);
  }
  draw();
  if(window.ResizeObserver){var last=0;new ResizeObserver(function(){var w=cw.clientWidth;if(Math.abs(w-last)>8){last=w;draw()}}).observe(cw)}
  else window.addEventListener('resize',draw);
  wrap.appendChild(tableView(sheet));
  return wrap;
}

function render(D){
  document.title=D.title;
  var B=D.brand||{},root=document.documentElement;window.__CUR__=B.currency||'$';
  if(B.accent)root.style.setProperty('--accent',B.accent);
  if(B.theme&&!root.getAttribute('data-theme'))root.setAttribute('data-theme',B.theme);
  var top=el('header','top'),topIn=el('div','in'),head=el('div','head'),left=el('div');
  var brandRow=el('div','brandrow');
  if(B.logo){
    var im=el('img','logo');im.src=B.logo;im.alt=D.title;im.referrerPolicy='no-referrer';im.onerror=function(){im.style.display='none'};
    if(B.link){var la=el('a');la.href=B.link;la.target='_blank';la.rel='noopener';la.appendChild(im);brandRow.appendChild(la)}else brandRow.appendChild(im);
  }
  var titles=el('div');titles.style.minWidth='0';
  titles.appendChild(el('h1',null,D.title));
  titles.appendChild(el('div','sub',(D.subtitle?D.subtitle+' · ':'')+'Updated '+D.generated));
  brandRow.appendChild(titles);left.appendChild(brandRow);
  var theme=el('button','btn','Theme');
  theme.onclick=function(){var r=document.documentElement,dark=r.getAttribute('data-theme')?r.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.setAttribute('data-theme',dark?'light':'dark')};
  head.append(left,theme);
  var nav=el('nav');nav.setAttribute('role','tablist');
  topIn.append(head,nav);top.appendChild(topIn);
  var main=el('main','main'),mainIn=el('div','in'),body=el('div');
  mainIn.appendChild(body);main.appendChild(mainIn);
  app.append(top,main,makeFooter(B));
  var firstSummary=D.sheets.findIndex(function(s){return s.kind==='summary'});
  var order=D.sheets.map(function(s,i){return i});
  var views=[];
  function show(i){
    Array.from(nav.children).forEach(function(b,j){b.setAttribute('aria-selected',j===i?'true':'false')});
    body.textContent='';
    if(!views[i]){var k=D.sheets[i].kind;views[i]=k==='summary'?summaryView(D.sheets[i]):k==='chart'?chartView(D.sheets[i]):tableView(D.sheets[i])}
    body.appendChild(views[i]);
    try{history.replaceState(null,'','#'+encodeURIComponent(D.sheets[i].name))}catch(e){}
  }
  D.sheets.forEach(function(s,i){var b=el('button',null,s.name);b.setAttribute('role','tab');b.onclick=function(){show(i)};nav.appendChild(b)});
  var start=D.sheets.findIndex(function(s){return s.name===decodeURIComponent(location.hash.slice(1))});
  show(start>=0?start:(firstSummary>=0?firstSummary:0));
}

if(window.__ENC__)unlockUI();else render(window.__DATA__);
})();
</script>
